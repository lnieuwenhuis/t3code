[extend]
useDefault = true

# This keyboard shortcut is not an API credential. Keep all other checks enabled.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "T3 keyboard shortcuts"
condition = "AND"
paths = ['''(^|/)packages/shared/src/keybindings\.ts$''']
regexTarget = "secret"
regexes = ['''^mod\+shift\+(enter|arrowup|arrowdown)$''']
